name: health

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Drift guard (sync_check)
        run: python3 tools/sync_check.py

      - name: Health audit — scan (reference integrity + layout)
        run: python3 tools/health_audit.py --scan

      - name: Health audit — full (controlled vocabulary)
        run: python3 tools/health_audit.py --full

      - name: Auditor self-test (golden set + oracle + pinned hash)
        run: python3 skills/health-auditor/tests/run_golden.py

      - name: Instruction block decomposition self-test
        run: python3 skills/health-auditor/scripts/instruction_blocks.py --self-test

      - name: Orchestration end-to-end scenario
        run: python3 skills/multi-agent-orchestrator/tests/run_scenario.py

      - name: Catalog validators (skipped when build artifacts absent)
        run: |
          if [ -d cross-mapping/nist-catalog/output ]; then
            python3 cross-mapping/nist-catalog/ingestion/validate_catalog.py
          else
            echo "catalog output/ not present (build artifact) — skipping"
          fi
