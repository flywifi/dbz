name: standards-watch

# Weekly (Monday) standards drift check: runs the registry-driven monitors, uploads the
# drift report, and files/updates a "standards drift report" issue when anything
# moved. Artifact fetch + rebuild is HUMAN-TRIGGERED only (workflow_dispatch with
# fetch=true) so canonical-source changes always arrive as a reviewable commit.

on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday (phase 51; provisional until the WS-5 delay probe pins it)
  workflow_dispatch:
    inputs:
      fetch:
        description: 'Also re-fetch auto_fetch artifacts (writes files; commit the diff manually)'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Standards drift check
        # The workflow token raises GitHub's limit from 60/h (unauthenticated, per IP) to
        # 1,000/h per repository (host_policies.json, api.github.com); the monitor's
        # github_authenticated flag is switched on for this step only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DBZ_FF_GITHUB_AUTHENTICATED: '1'
        run: python3 tools/standards_refresh.py --check

      # The runner is a fresh checkout: the generated catalog is a build product, not
      # committed. Without it the build dies (FileNotFoundError on
      # NIST_800_53_FULL_ALL_FAMILIES.json). The OSCAL catalog the build reads is committed
      # (canonical-sources/source_data/nist-800-53, phase 52), so no warm-up fetch remains and
      # a fresh build reads the same input as the committed derived data.
      - name: Build prerequisite (generated catalog; the OSCAL catalog is committed, phase 52)
        run: python3 cross-mapping/nist-catalog/ingestion/generate_controls.py

      - name: Oracle accuracy benchmark (build db, then regression check)
        run: |
          python3 cross-mapping/engine/build_db.py
          python3 cross-mapping/tests/benchmark_oracles.py --check
          python3 cross-mapping/tests/run_scenarios.py
          python3 cross-mapping/tests/test_alias_contract.py

      - name: Optional artifact fetch (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch == 'true' }}
        run: python3 tools/standards_refresh.py --fetch

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: standards-drift-report
          path: cross-mapping/output/standards_drift_report.json

      - name: File / update drift issue
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'cross-mapping/output/standards_drift_report.json';
            if (!fs.existsSync(path)) return;
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const summary = report.summary || {};
            const bad = (s) => s === 'drift' || s === 'check_failed';
            const dedicated = [['stig', report.stig_status], ['cci', report.cci_status]];
            const refusals = report.policy_refusals || 0;
            const idle = report.inactivity_warning ? report.days_since_last_commit : 0;
            const drifted = (summary.registry_stale || 0) + (summary.artifact_stale || 0) + (summary.check_failed || 0)
              + dedicated.filter(([, s]) => bad(s)).length + (refusals > 0 ? 1 : 0) + (idle ? 1 : 0);
            if (drifted === 0) { core.info('no drift — no issue'); return; }
            const title = 'standards drift report';
            const sig = ['| dedicated check | status | detail |', '|---|---|---|'];
            for (const [name, s] of dedicated) sig.push(`| ${name} | ${s || 'n/a'} | |`);
            for (const [name, s] of Object.entries(report.stig_signals || {})) {
              const detail = [s.library, s.reason, s.n_newer ? `${s.n_newer} newer` : ''].filter(Boolean).join(' — ');
              sig.push(`| stig/${name} | ${s.status} | ${detail} |`);
            }
            if (refusals) sig.push(`| fetch policy | ${refusals} refused | per-host reasons in fetch_ledger (artifact) |`);
            if (idle) sig.push(`| inactivity | ${idle} days since the last commit | GitHub disables scheduled workflows at 60 days; merge a refresh PR or commit |`);
            const lines = ['| framework | version | status | last_verified |', '|---|---|---|---|'];
            for (const f of report.feeds) {
              if (['registry_stale', 'artifact_stale', 'check_failed'].includes(f.classification)) {
                lines.push(`| ${f.framework_id} | ${f.current_version} | ${f.classification} | ${f.last_verified} |`);
              }
            }
            const body = `Generated ${report.generated_at}\n\n${sig.join('\n')}\n\n${lines.join('\n')}\n\nFull report in the workflow artifact. Runbook: docs/standards-refresh-runbook.md`;
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'standards-drift'});
            if (issues.data.length) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issues.data[0].number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['standards-drift']});
            }
